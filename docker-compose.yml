services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "18000:18000"
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND: postgres
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      HNSW_EF_SEARCH: "40"
      HF_HOME: /opt/hf
      SENTENCE_TRANSFORMERS_HOME: /opt/hf
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s

volumes:
  pgdata:
